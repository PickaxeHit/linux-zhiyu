# Autoloading these keeps the board out of deep sleep.
#
# The device tree describes the Coresight/STM trace hardware and the DSP RPC
# services, so udev loads their drivers on every boot even though nothing on
# this board uses them.  While they are loaded, "mem" suspend returns after
# 30-100 ms instead of staying asleep; the same kernel and the same module set
# without them sleeps for the whole RTC alarm.  The DSP compute engines
# (fastrpc, qcomtee) are unused here as well, and snd-soc-sc8280xp is a machine
# driver for a different SoC that has no business loading.
#
# install:  sudo install -m644 configs/modprobe.d/99-zhiyu-no-trace.conf \
#                /etc/modprobe.d/
blacklist coresight
blacklist coresight_cti
blacklist coresight_funnel
blacklist coresight_stm
blacklist coresight_tmc
blacklist stm_core
blacklist stm_p_basic
blacklist fastrpc
blacklist qcomtee
blacklist snd_soc_sc8280xp
