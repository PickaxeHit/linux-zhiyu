# ALSA UCM profile for the Lenovo TB378FC (mainline sm8750 machine driver).
#
# The card id is "sm8750" (see the "model" in the board device tree), which is
# what alsa-ucm uses to look this file up: without it PipeWire has no profile
# for the card and exposes neither the speakers nor the microphones.
Syntax 4

SectionUseCase."HiFi" {
	File "/sm8750/HiFi.conf"
	Comment "Speakers and internal microphones"
}
