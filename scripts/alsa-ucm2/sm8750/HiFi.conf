# HiFi use case for the Lenovo TB378FC.
#
# The capture path is fully described by the machine driver: it pins the TX
# macro's decimator inputs (SWR_MIC4 = ADC1/AMIC1, SWR_MIC6 = ADC3/AMIC4), the
# ADC modes, the decimator gains and the AIF1 capture mixers at card probe.
# The EnableSequence repeats the few settings that decide *which* microphones
# are recorded, so a user (or a UCM client restoring its own state) can pick
# them, and the DisableSequence only drops the capture mixers.
SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]
	Value {
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones (AMIC1 + AMIC4)"

	EnableSequence [
		cset "name='TX0 MODE' ADC_LP"
		cset "name='TX1 MODE' ADC_LP"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC3 MUX' CH3_AMIC4"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX SMIC MUX1' SWR_MIC6"
		cset "name='TX_DEC0 Volume' 102"
		cset "name='TX_DEC1 Volume' 102"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
	}
}
