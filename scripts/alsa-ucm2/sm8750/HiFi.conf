# HiFi use case for the Lenovo TB378FC.
#
# The capture path is fully described by the machine driver: it pins the TX
# macro's decimator inputs (SWR_MIC4 = ADC1/AMIC1, SWR_MIC6 = ADC3/AMIC4), the
# ADC modes, the decimator gains and the AIF1 capture mixers at card probe.
# The EnableSequence repeats the few settings that decide *which* microphones
# are recorded, so a user (or a UCM client restoring its own state) can pick
# them, and the DisableSequence only drops the capture mixers.
SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]
	Value {
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPCM "hw:${CardId},0"
		# Stereo: the DSP's MFC expands it to the four TDM slots, and
		# that mixer (two inputs, four outputs) is also what rotates the
		# speakers with the device orientation.
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	EnableSequence [
		cset "name='TX0 MODE' ADC_LP"
		cset "name='TX1 MODE' ADC_LP"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC3 MUX' CH3_AMIC4"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX SMIC MUX1' SWR_MIC6"
		# 102 is +18 dB in the decimator's 1 dB steps (84 = 0 dB,
		# 124 = +40 dB).  This is a digital gain after the ADC, so it
		# raises the signal and the noise floor by the same amount: it
		# does not improve the SNR, it only makes whatever the analogue
		# front end picked up louder.  It is set high here on purpose,
		# because the microphones are quiet without it.
		cset "name='DEC0 MODE' ADC_HIGH_PERF"
		cset "name='DEC1 MODE' ADC_HIGH_PERF"
		cset "name='TX_DEC0 Volume' 102"
		cset "name='TX_DEC1 Volume' 102"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
	}
}

# The card publishes a channel map for every count it supports (see
# q6apm_chmap_4ch in q6apm-dai.c).  Without an entry for the requested count,
# PipeWire's format negotiation fails and the node is never created - the error
# it reports ("usage: node.name=<string>") has nothing to do with the name.
