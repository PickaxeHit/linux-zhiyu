name: Build images and packages

# Builds everything this port ships from the main tree:
#   - boot.img, vendor_boot.img, init_boot.img (kernel + initramfs + AVB)
#   - linux-zhiyu-modules: the kernel modules for the rootfs (re-probing; the
#     boot critical ones also live in the vendor ramdisk)
#   - linux-zhiyu-headers: a prepared tree for out-of-tree module builds
#   - linux-zhiyu-firmware: the board blobs plus the built AudioReach topology
#   - libcamera (the tb378fc fork: simple pipeline, EGL debayer, CDAF)
#   - sensord (SensorProxy daemon backed by sensh/SNS Client)
# Everything is packaged as both Debian (.deb) and Arch (.pkg.tar.zst) so any
# of the rootfs images can install it.

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: Build the kernel and the three images
        type: boolean
        default: true
      packages:
        description: Build the libcamera and sensord packages
        type: boolean
        default: true
      image_compression:
        description: Compression for the uploaded image tarball
        type: choice
        options: [zstd, xz]
        default: zstd
      release:
        description: Publish the rolling "packages" release
        type: boolean
        default: true

# The release job uploads assets to the repository's releases.
permissions:
  contents: write

env:
  LC_OPTIONS: >-
    -Dwerror=false
    -Dqcam=enabled
    -Dpipelines=simple
    -Dgstreamer=disabled
    -Dpycamera=disabled
    -Ddocumentation=disabled
    -Dcam=enabled
    -Dv4l2=enabled

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Free disk space and install host tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git pkg-config bc bison flex cpio \
            libssl-dev libelf-dev libncurses-dev lz4 zstd xz-utils \
            device-tree-compiler clang lld llvm pahole \
            meson ninja-build cmake cargo curl dpkg-dev \
            libudev-dev libdrm-dev libevent-dev libyaml-dev libjpeg-dev \
            libglib2.0-dev python3-jinja2 python3-ply python3-yaml \
            qt6-base-dev libgl1-mesa-dev
          # Ubuntu's mkbootimg package ships the script without the gki module
          # it imports ("ModuleNotFoundError: No module named 'gki'"), so use
          # the AOSP tree directly: its script finds gki/ next to itself.
          sudo git clone --depth 1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            /usr/local/lib/mkbootimg
          sudo tee /usr/bin/mkbootimg >/dev/null <<'EOF'
          #!/bin/sh
          exec python3 /usr/local/lib/mkbootimg/mkbootimg.py "$@"
          EOF
          sudo chmod 755 /usr/bin/mkbootimg

          # Ubuntu has no avbtool package (and android-tools-mkbootimg was
          # replaced by mkbootimg); the AOSP script is what the image scripts
          # expect at /usr/bin/avbtool.
          # The ?format=TEXT download of avbtool 404s; clone the tree the same
          # way as mkbootimg.  Note that the old version of this step left an
          # empty /usr/bin/avbtool behind, so check for a working one.
          if ! avbtool version >/dev/null 2>&1; then
            sudo rm -f /usr/bin/avbtool
            sudo git clone --depth 1 \
              https://android.googlesource.com/platform/external/avb \
              /usr/local/lib/avb
            # the script is not always called plain "avbtool" (and it may be a
            # symlink), so locate whatever the tree actually ships
            AVB=$(sudo find /usr/local/lib/avb -maxdepth 2 -name 'avbtool*' | head -1)
            echo "avbtool script: $AVB"
            printf '#!/bin/sh\nexec python3 %s "$@"\n' "$AVB" | sudo tee /usr/bin/avbtool >/dev/null
            sudo chmod 755 /usr/bin/avbtool
          fi
          command -v mkbootimg avbtool dtc clang ld.lld
          avbtool version
          clang --version | head -1
          df -h /

      - name: Checkout linux-zhiyu with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Resolve kernel revision
        id: krev
        run: |
          echo "sha=$(git ls-remote https://github.com/PickaxeHit/linux-kernel-zhiyu.git \
            refs/heads/zhiyu | cut -f1)" >> "$GITHUB_OUTPUT"

      # The kernel is by far the slowest part (LTO on 4 vCPUs, ~40 min), and
      # most iterations only touch scripts or packages.  Keep the built tree
      # around so a run with the same kernel commit and config skips it.
      - name: Restore kernel build tree
        if: ${{ inputs.kernel }}
        uses: actions/cache@v4
        with:
          path: kernel-source
          # Only the kernel commit and its config matter here: touching
          # .gitmodules (adding an unrelated submodule) must not throw away
          # 20 minutes of compilation.
          key: kernel-${{ steps.krev.outputs.sha }}-${{ hashFiles('configs/linux-7.3-zhiyu.config') }}

      - name: Fix submodule URLs for CI
        run: |
          # .gitmodules uses git@github.com: for libcamera; CI has no SSH key.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
          git -C kernel-source log --oneline -1
          git -C libcamera log --oneline -1

      - name: Set up native Rust for the IDL compiler
        if: ${{ inputs.kernel }}
        uses: dtolnay/rust-toolchain@stable

      - name: Build kernel, initramfs and the three images
        if: ${{ inputs.kernel }}
        run: |
          set -euo pipefail
          JOBS=$(nproc) ./build.sh
          ./mkinitbootimg
          # All LSM variants must be usable from either slot.
          unpack_dir=$(mktemp -d)
          trap 'rm -rf "$unpack_dir"' EXIT
          for image in out/boot*.img; do
            python3 /usr/local/lib/mkbootimg/unpack_bootimg.py \
              --boot_img "$image" --out "$unpack_dir" > "$unpack_dir/header"
            if grep -qF 'androidboot.slot_suffix=' "$unpack_dir/header"; then
              echo "Hardcoded slot in $image" >&2
              exit 1
            fi
          done
          ls -l out/boot*.img out/vendor_boot.img out/init_boot.img
          sha256sum out/boot*.img out/vendor_boot.img out/init_boot.img

      # actions/cache only saves on success, and a run that fails afterwards
      # (packaging, upload) must not throw away 40 minutes of LTO.  Save the
      # tree explicitly, unconditionally.
      - name: Save kernel build tree
        if: always() && inputs.kernel
        uses: actions/cache/save@v4
        with:
          path: kernel-source
          # Only the kernel commit and its config matter here: touching
          # .gitmodules (adding an unrelated submodule) must not throw away
          # 20 minutes of compilation.
          key: kernel-${{ steps.krev.outputs.sha }}-${{ hashFiles('configs/linux-7.3-zhiyu.config') }}

      - name: Package kernel modules, headers and firmware
        if: ${{ inputs.kernel }}
        run: |
          set -euo pipefail
          KS=kernel-source
          VER="$(make -s -C "$KS" ARCH=arm64 kernelrelease)"
          echo "kernel release: $VER"

          # ---- modules ----
          make -C "$KS" ARCH=arm64 \
            INSTALL_MOD_PATH="$PWD/stage/linux-zhiyu-modules" modules_install
          # modules_install writes lib/modules; on Arch /lib is a symlink to
          # usr/lib owned by the filesystem package, so packaging lib/... both
          # conflicts with it and would claim the symlink itself.
          mkdir -p "stage/linux-zhiyu-modules/usr"
          if [ -d "stage/linux-zhiyu-modules/lib" ]; then
            mv "stage/linux-zhiyu-modules/lib" "stage/linux-zhiyu-modules/usr/lib"
          fi
          # build/source point into the CI tree; useless (and dangling) in a
          # package.
          rm -f "stage/linux-zhiyu-modules/usr/lib/modules/$VER/build" \
                "stage/linux-zhiyu-modules/usr/lib/modules/$VER/source"
          if command -v depmod >/dev/null; then
            depmod -b "stage/linux-zhiyu-modules/usr" "$VER" || true
          fi
          PKG_NAME=linux-zhiyu-modules \
          PKG_VERSION="$VER" \
          PKG_DESC="Linux $VER modules for the zhiyu port" \
          PKG_DEB_DEPENDS="kmod" \
          PKG_ARCH_DEPENDS="kmod" \
          scripts/mkpkgs.sh stage/linux-zhiyu-modules out/pkgs

          # ---- headers ----
          # A prepared build tree, which is what out-of-tree module builds
          # need (UAPI only would be useless for that).
          make -C "$KS" ARCH=arm64 prepare modules_prepare
          # absolute: the copies below run from inside the kernel tree
          H="$PWD/stage/linux-zhiyu-headers/usr/src/linux-headers-$VER"
          install -d "$H/arch/arm64"
          ( cd "$KS" && cp -a include "$H"/include &&
              cp -a arch/arm64/include "$H"/arch/arm64/include &&
              cp -a arch/arm64/Makefile "$H"/arch/arm64/Makefile &&
              cp -a scripts "$H"/scripts &&
              cp -a Module.symvers .config Makefile "$H"/ )
          install -d "stage/linux-zhiyu-headers/usr/lib/modules/$VER"
          ln -sfn "../../../src/linux-headers-$VER" \
            "stage/linux-zhiyu-headers/usr/lib/modules/$VER/build"
          du -sh "$H"
          # provides linux-headers: AUR/out-of-tree module builds depend on
          # that name, and without it pacman would pull Arch's official
          # linux-headers (for the wrong kernel) instead of this tree.
          PKG_NAME=linux-zhiyu-headers \
          PKG_VERSION="$VER" \
          PKG_DESC="Linux $VER headers for the zhiyu port" \
          PKG_DEB_DEPENDS="gcc-14" \
          PKG_DEB_PROVIDES="linux-headers" \
          PKG_ARCH_DEPENDS="gcc" \
          PKG_ARCH_PROVIDES="linux-headers" \
          scripts/mkpkgs.sh stage/linux-zhiyu-headers out/pkgs

          # ---- firmware ----
          F=stage/linux-zhiyu-firmware/usr/lib/firmware
          install -d "$F"
          cp -a initramfs-src/blobs/firmware/. "$F"/
          install -Dm644 initramfs-src/tplg/sm8750-tplg.bin \
            "$F/qcom/sm8750/sm8750-tplg.bin"
          # The SNS config/registry hexagonrpcd serves to the ADSP belongs with
          # the firmware: the rootfs then gets it from this package instead of
          # copying initramfs-src/blobs/sensors itself.
          Q=stage/linux-zhiyu-firmware/usr/share/qcom
          install -d "$Q"
          cp -a initramfs-src/blobs/sensors "$Q"/
          find "$F" -type f | wc -l
          find "$Q" -type f | wc -l
          PKG_NAME=linux-zhiyu-firmware \
          PKG_VERSION="$VER" \
          PKG_DESC="Firmware blobs, AudioReach topology and SNS registry for the zhiyu port" \
          PKG_DEB_DEPENDS="" \
          PKG_ARCH_DEPENDS="" \
          scripts/mkpkgs.sh stage/linux-zhiyu-firmware out/pkgs
          ls -l out/pkgs

      - name: Build libcamera and package it
        if: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          cd libcamera
          meson setup build --buildtype=release --prefix=/usr --libdir=lib $LC_OPTIONS
          meson compile -C build
          DESTDIR="$PWD/../stage/libcamera" meson install -C build --no-rebuild
          cd ..
          # libcamera ships udev rules and the IPA modules; keep them.
          #
          # The package is deliberately *not* called "libcamera": on a rolling
          # distribution a newer distro libcamera would replace it silently and
          # the camera would stop working (no qcom-camss).  With its own name
          # plus a conflict, pacman instead refuses that upgrade loudly, and
          # the soname provides (generated by mkpkgs.sh) keep gst-plugin-
          # libcamera / plasma-camera satisfied as long as the distro package
          # is not installed.  Once upstream libcamera has the autofocus work
          # this package can be dropped entirely.
          #
          # Our build already contains what the distributions split out into
          # libcamera-tools (cam, libcamerify, ...) and libcamera-ipa (the
          # hardware IPA modules, which this board does not use).  Claim both
          # names and conflict with them so that "pacman -U" / "dpkg -i"
          # replaces the distro packages instead of failing on file conflicts
          # or leaving two libcamera copies behind.  The replaces entries
          # matter too: with conflicts alone pacman stops at "Remove
          # libcamera-tools? [y/N]" and --noconfirm answers no.
          #
          # Note: no comment lines inside the PKG_* backslash chain below,
          # they terminate it.
          PKG_NAME=libcamera-zhiyu \
          PKG_VERSION=$(meson introspect libcamera/build --projectinfo | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])') \
          PKG_DESC="Camera stack for the zhiyu port (simple pipeline, EGL debayer, CDAF)" \
          PKG_DEB_DEPENDS="libc6, libstdc++6, libudev1, libdrm2, libyaml-0-2, libevent-2.1-7, libjpeg62-turbo, libqt6widgets6" \
          PKG_DEB_PROVIDES="libcamera-tools, libcamera-ipa, libcamera0.7" \
          PKG_DEB_CONFLICTS="libcamera-tools, libcamera-ipa, libcamera0.7" \
          PKG_DEB_REPLACES="libcamera-tools, libcamera-ipa, libcamera0.7" \
          PKG_ARCH_DEPENDS="gcc-libs glibc systemd-libs libdrm libyaml libevent libjpeg-turbo qt6-base" \
          PKG_ARCH_PROVIDES="libcamera libcamera-tools libcamera-ipa" \
          PKG_ARCH_CONFLICTS="libcamera libcamera-tools libcamera-ipa" \
          PKG_ARCH_REPLACES="libcamera libcamera-tools libcamera-ipa" \
          scripts/mkpkgs.sh stage/libcamera out/pkgs

      - name: Build sensord and package it
        if: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          make -C sensors
          # zhiyu-sensord, not sensord: lm_sensors owns /usr/bin/sensord and
          # its unit, and pacman refuses to overwrite another package's files.
          install -Dm755 sensors/sensord stage/zhiyu-sensord/usr/bin/zhiyu-sensord
          # The unit in the tree points at /usr/local/bin for hand installs;
          # the package owns /usr/bin.
          install -Dm644 sensors/zhiyu-sensord.service \
            stage/zhiyu-sensord/usr/lib/systemd/system/zhiyu-sensord.service
          sed -i 's#^ExecStart=.*#ExecStart=/usr/bin/zhiyu-sensord#' \
            stage/zhiyu-sensord/usr/lib/systemd/system/zhiyu-sensord.service
          PKG_NAME=zhiyu-sensord \
          PKG_VERSION=1.0.0 \
          PKG_DESC="SensorProxy daemon backed by sensh/SNS Client" \
          PKG_DEB_DEPENDS="libc6, libglib2.0-0" \
          PKG_ARCH_DEPENDS="glibc glib2" \
          scripts/mkpkgs.sh stage/zhiyu-sensord out/pkgs
          ls -l out/pkgs

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ inputs.kernel }}" = "true" ]; then
            cp out/boot*.img out/vendor_boot.img out/init_boot.img dist/
          fi
          if [ "${{ inputs.packages }}" = "true" ]; then
            cp out/pkgs/* dist/
          fi
          if [ "${{ inputs.image_compression }}" = "xz" ]; then
            tar -C dist -I 'xz -9e -T0' -cf images-and-packages.tar.xz .
          else
            tar -C dist -I 'zstd -T0 -19' -cf images-and-packages.tar.zst .
          fi
          sha256sum images-and-packages.tar.* > images-and-packages.sha256
          ls -lh dist images-and-packages.*

      # Rolling release with stable asset names, so the rootfs builders can
      # install them straight from
      #   https://github.com/PickaxeHit/linux-zhiyu/releases/latest/download/<name>
      # instead of carrying their own copy of the firmware and rebuilding
      # libcamera/sensord.  Assets are replaced on every build.
      - name: Publish rolling release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p rel
          cp_pkg() {   # cp_pkg <glob> <stable name>; missing sources are fine
            local src
            src=$(ls $1 2>/dev/null | head -1) || true
            if [ -n "${src:-}" ] && [ -f "$src" ]; then
              cp -f "$src" "rel/$2"
            fi
            return 0
          }
          cp_pkg 'out/pkgs/linux-zhiyu-modules-*.pkg.tar.zst'  zhiyu-modules.pkg.tar.zst
          cp_pkg 'out/pkgs/linux-zhiyu-headers-*.pkg.tar.zst'  zhiyu-headers.pkg.tar.zst
          cp_pkg 'out/pkgs/linux-zhiyu-firmware-*.pkg.tar.zst' zhiyu-firmware.pkg.tar.zst
          cp_pkg 'out/pkgs/libcamera-*.pkg.tar.zst'            zhiyu-libcamera.pkg.tar.zst
          cp_pkg 'out/pkgs/zhiyu-sensord-*.pkg.tar.zst'        zhiyu-sensord.pkg.tar.zst
          cp_pkg 'out/pkgs/linux-zhiyu-modules_*.deb'          zhiyu-modules.deb
          cp_pkg 'out/pkgs/linux-zhiyu-headers_*.deb'          zhiyu-headers.deb
          cp_pkg 'out/pkgs/linux-zhiyu-firmware_*.deb'         zhiyu-firmware.deb
          cp_pkg 'out/pkgs/libcamera_*.deb'                    zhiyu-libcamera.deb
          cp_pkg 'out/pkgs/zhiyu-sensord_*.deb'                zhiyu-sensord.deb
          # boot.img is the default (no lsm= override) variant; the lsm
          # variants only differ in the command line, the kernel is identical.
          cp_pkg 'out/boot-none.img'                           zhiyu-boot-none.img
          cp_pkg 'out/boot.img'                                zhiyu-boot.img
          cp_pkg 'out/boot-selinux.img'                        zhiyu-boot-selinux.img
          cp_pkg 'out/boot-apparmor.img'                       zhiyu-boot-apparmor.img
          cp_pkg 'out/vendor_boot.img'                         zhiyu-vendor_boot.img
          cp_pkg 'out/init_boot.img'                           zhiyu-init_boot.img
          ls -l rel
          tag=packages
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "CI packages (rolling)" \
              --notes "Packages and images built by images.yml. Asset names are stable; each build replaces them."
          fi
          shopt -s nullglob
          files=(rel/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing to publish"
            exit 0
          fi
          gh release upload "$tag" "${files[@]}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: zhiyu-images-and-packages
          path: |
            dist/*
            images-and-packages.tar.*
            images-and-packages.sha256
          compression-level: 0
          retention-days: 7
