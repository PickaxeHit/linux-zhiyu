name: Build images and packages

on:
  pull_request:
    paths:
      - '**.nix'
      - flake.lock
      - nix/**
      - deps/**
      - .gitmodules
      - kernel-source
      - libcamera/**
      - configs/**
      - dts/**
      - initramfs-src/**
      - keymint/**
      - sensors/**
      - scripts/**
      - mk*img
      - avb-test-key.pem
      - .github/workflows/build.yml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kernel:
        description: Build the kernel and signed boot images for Debian, Arch Linux ARM and Fedora
        type: boolean
        default: true
      packages:
        description: Build userspace packages for Debian, Arch Linux ARM and Fedora
        type: boolean
        default: true
      nix:
        description: Build and verify the Nix BSP packages
        type: boolean
        default: true
      image_compression:
        description: Compression for the uploaded image tarball
        type: choice
        options: [zstd, xz]
        default: xz
      publish:
        description: Publish selected package repositories, the Nix binary cache and signed boot images
        type: boolean
        default: false
      strict_lock:
        description: Require committed dependency revisions and captured build environment
        type: boolean
        default: false

permissions:
  contents: read

env:
  NIX_BSP_SUBSTITUTER: https://github.com/PickaxeHit/linux-zhiyu-pkgs/releases/download/nix-cache-index/

concurrency:
  group: build-and-publish-${{ github.ref }}

jobs:
  common:
    name: Build shared images and kernel
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.kernel || inputs.packages || !inputs.nix))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    outputs:
      revision: ${{ steps.revision.outputs.value }}
    env:
      KERNEL_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G
      STRICT_LOCK: ${{ (github.event_name == 'workflow_dispatch' && inputs.strict_lock) }}
    steps:
      - name: Validate inputs
        env:
          BUILD_KERNEL: ${{ (github.event_name == 'push' || inputs.kernel) }}
          BUILD_USERSPACE: ${{ (github.event_name == 'push' || inputs.packages) }}
          PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) }}
        run: |
          if [[ "$BUILD_KERNEL" != true && "$BUILD_USERSPACE" != true ]]; then
            echo 'Select at least one build target' >&2; exit 1
          fi
          if [[ "$PUBLISH" == true && ( "$BUILD_KERNEL" != true || "$BUILD_USERSPACE" != true ) ]]; then
            echo 'Publishing requires both kernel and packages' >&2; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize pinned submodules
        run: scripts/init-submodules.sh
      - name: Set build revision (shared across all jobs)
        id: revision
        run: |
          value="$(TZ=Asia/Shanghai date +%Y%m%d).$((GITHUB_RUN_ID * 1000 + GITHUB_RUN_ATTEMPT))"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "PKG_REVISION=$value" >> "$GITHUB_ENV"
      - name: Resolve dependency lock once
        run: |
          if [[ "$STRICT_LOCK" != true ]]; then python3 scripts/deps.py lock --missing; fi
          python3 scripts/deps.py check --locked
      - name: Install common build tools
        if: (github.event_name == 'push' || inputs.kernel)
        run: scripts/install-ubuntu-build-deps.sh
      - name: Offline build-tool smoke tests
        run: |
          python3 scripts/test-build-tools.py
          python3 scripts/test-ci-tools.py
      - name: Identify toolchain
        if: (github.event_name == 'push' || inputs.kernel)
        id: toolchain
        run: echo "id=$(gcc --version | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache compiler results (not kernel source)
        if: (github.event_name == 'push' || inputs.kernel)
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-
      - name: Set up native Rust for IDL compiler
        if: (github.event_name == 'push' || inputs.kernel)
        run: scripts/setup-rust.sh
      - name: Build images and shared stage
        if: (github.event_name == 'push' || inputs.kernel)
        run: |
          ./build.sh images
          ./build.sh stage-kernel
          ccache -s
      - name: Record common build provenance
        run: |
          ./build.sh manifest
          mkdir -p out/ci-common
          cp deps/deps.json out/ci-common/deps.json
          cp out/manifest.json out/ci-common/manifest.json
      - name: Bundle shared stage and images (preserve permissions and symlinks)
        if: (github.event_name == 'push' || inputs.kernel)
        run: scripts/ci-bundle-common.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyu-common-metadata
          path: out/ci-common/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || inputs.kernel)
        with:
          name: zhiyu-common-stage
          path: out/ci-transfer/stage.tar.zst*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || inputs.kernel)
        with:
          name: zhiyu-common-images
          path: out/ci-transfer/images.tar.zst*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  packages:
    name: Build packages (${{ matrix.distro }})
    needs: common
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, arch, fedora]
    env:
      CONTAINER_ENGINE: docker
      BUILD_KERNEL: ${{ (github.event_name == 'push' || inputs.kernel) }}
      BUILD_USERSPACE: ${{ (github.event_name == 'push' || inputs.packages) }}
      PKG_REVISION: ${{ needs.common.outputs.revision }}
      STRICT_LOCK: ${{ (github.event_name == 'workflow_dispatch' && inputs.strict_lock) }}
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize pinned submodules for userspace
        if: (github.event_name == 'push' || inputs.packages)
        run: scripts/init-submodules.sh
      - uses: actions/download-artifact@v4
        with:
          name: zhiyu-common-metadata
          path: out/ci-common
      - name: Use shared dependency lock
        run: |
          cp out/ci-common/deps.json deps/deps.json
          python3 scripts/deps.py check --locked
      - uses: actions/download-artifact@v4
        if: (github.event_name == 'push' || inputs.kernel)
        with:
          name: zhiyu-common-stage
          path: out/ci-transfer
      - name: Restore common package stage
        if: (github.event_name == 'push' || inputs.kernel)
        run: scripts/ci-restore-common.sh stage
      - name: Build selected distro packages
        run: scripts/run-package-container.sh "$DISTRO"
      - name: Collect package files and provenance
        run: |
          mkdir -p out/ci-result
          if [[ "$DISTRO" == fedora ]]; then
            mkdir -p out/ci-result/rpms
            cp -a out/rpms/aarch64 out/ci-result/rpms/
          else
            cp -a out/pkgs out/ci-result/
          fi
          cp -a out/package-environments out/ci-result/
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyu-matrix-${{ matrix.distro }}
          path: out/ci-result/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  # Keep job ID/name 'build' for existing publish.yml manual retry checks.
  build:
    needs: [common, packages]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PKG_REVISION: ${{ needs.common.outputs.revision }}
      IMAGE_COMPRESSION: ${{ inputs.image_compression || 'xz' }}
      BUILD_KERNEL: ${{ (github.event_name == 'push' || inputs.kernel) }}
      BUILD_USERSPACE: ${{ (github.event_name == 'push' || inputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zhiyu-common-metadata
          path: out/ci-common
      - name: Use shared dependency lock
        run: cp out/ci-common/deps.json deps/deps.json
      - uses: actions/download-artifact@v4
        if: (github.event_name == 'push' || inputs.kernel)
        with:
          name: zhiyu-common-images
          path: out/ci-transfer
      - name: Restore common images and checksums
        if: (github.event_name == 'push' || inputs.kernel)
        run: scripts/ci-restore-common.sh images
      - uses: actions/download-artifact@v4
        with:
          name: zhiyu-matrix-debian
          path: out/ci-results/debian
      - uses: actions/download-artifact@v4
        with:
          name: zhiyu-matrix-arch
          path: out/ci-results/arch
      - uses: actions/download-artifact@v4
        with:
          name: zhiyu-matrix-fedora
          path: out/ci-results/fedora
      - name: Validate and merge all matrix packages
        run: |
          flags=()
          if [[ "$BUILD_KERNEL" == true ]]; then flags+=(--kernel); fi
          if [[ "$BUILD_USERSPACE" == true ]]; then flags+=(--userspace); fi
          python3 scripts/ci-artifacts.py "${flags[@]}"
          python3 scripts/build-manifest.py --base out/ci-common/manifest.json
      - name: Archive signed images
        if: (github.event_name == 'push' || inputs.kernel)
        run: scripts/archive-images.sh --prepared
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyu-fedora-rpms
          path: out/rpms/aarch64/*.rpm
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || inputs.kernel)
        with:
          name: zhiyu-images
          path: out/zhiyu-images.tar.*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyu-package-repositories-input
          path: out/pkgs/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyu-build-manifest
          path: out/manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyu-resolved-dependencies
          path: deps/deps.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  nix_evaluate:
    name: Evaluate Nix packages
    if: github.event_name != 'workflow_dispatch' || inputs.nix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
      - name: Validate locks, formatting and flake
        run: |
          python3 scripts/deps.py check --locked
          python3 scripts/gen-nix-sources.py --check
          nix fmt -- --check flake.nix nix/*.nix
          nix flake show --all-systems
          nix flake check --all-systems --no-build
          python3 scripts/test-nix-incremental.py
      - name: Traditional build tools
        run: |
          python3 scripts/test-build-tools.py
          python3 scripts/test-ci-tools.py

  nix_build:
    name: Build Nix packages (ARM64)
    needs: nix_evaluate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
        with:
          extra_nix_config: |
            max-jobs = 1
            cores = 4
      - name: Configure the signed cache
        if: ${{ vars.NIX_CACHE_PUBLIC_KEY != '' }}
        env:
          NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        run: |
          {
            printf 'extra-substituters = %s\n' "$NIX_BSP_SUBSTITUTER"
            printf 'extra-trusted-public-keys = %s\n' "$NIX_CACHE_PUBLIC_KEY"
          } >> "$GITHUB_ENV.nix"
          echo "NIX_USER_CONF_FILES=$GITHUB_ENV.nix" >> "$GITHUB_ENV"
      - name: Build and verify the BSP
        run: |
          nix flake check -L --keep-going
      - name: Stage the runtime cache closure
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -o pipefail
          nix build --no-link --print-out-paths -L \
            '.#kernel^*' .#dtb .#firmware .#sns .#topology .#ucm2 .#udev-rules \
            .#initramfs .#busybox .#fsck-f2fs .#keymint .#static-helpers \
            .#sensh .#sensord .#hexagonrpc '.#libcamera-0_7^*' '.#libcamera-0_8^*' \
            .#flasher .#qcom-va-driver |
            python3 scripts/nix-cache.py prepare "$RUNNER_TEMP/nix-cache"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: nix-cache
          path: ${{ runner.temp }}/nix-cache/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish:
    name: Publish
    needs: [build, nix_build]
    if: >-
      ${{ always() && !cancelled() &&
          ((needs.build.result == 'success' &&
            (github.event_name == 'push' || (inputs.publish && inputs.kernel && inputs.packages))) ||
           (needs.nix_build.result == 'success' &&
            (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      publish_packages: ${{ needs.build.result == 'success' && (github.event_name == 'push' || (inputs.publish && inputs.kernel && inputs.packages)) }}
      publish_nix_cache: ${{ needs.nix_build.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
