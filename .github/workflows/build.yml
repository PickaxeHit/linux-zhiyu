name: Build images and packages

# Builds everything this port ships from the main tree:
#   - boot.img, vendor_boot.img, init_boot.img, vbmeta.img (kernel + initramfs + AVB)
#   - linux-zhiyu-modules: the kernel modules for the rootfs (re-probing; the
#     boot critical ones also live in the vendor ramdisk)
#   - linux-zhiyu-headers: a prepared tree for out-of-tree module builds
#   - linux-zhiyu-firmware: the board blobs plus the built AudioReach topology
#   - libcamera (cloned from the zhiyu fork at build time: per-release branches)
#   - sensord (SensorProxy daemon backed by sensh/SNS Client)
# Everything is packaged as both Debian (.deb) and Arch (.pkg.tar.zst) so any
# of the rootfs images can install it.

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: Build the kernel and the signed images
        type: boolean
        default: true
      packages:
        description: Build the libcamera and sensord packages
        type: boolean
        default: true
      image_compression:
        description: Compression for the uploaded image tarball
        type: choice
        options: [zstd, xz]
        default: xz
      publish:
        description: Publish packages and signed images after a complete build
        type: boolean
        default: false

permissions:
  contents: read

env:
  LC_OPTIONS: >-
    -Dwerror=false
    -Dqcam=enabled
    -Dpipelines=simple
    -Dgstreamer=disabled
    -Dpycamera=disabled
    -Ddocumentation=disabled
    -Dcam=enabled
    -Dv4l2=enabled

concurrency:
  group: images-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Validate publication inputs
        if: inputs.publish && (!inputs.kernel || !inputs.packages)
        run: |
          echo "::error::Publishing requires both kernel and packages"
          exit 1

      - name: Free disk space and install host tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git pkg-config bc bison flex cpio \
            libssl-dev libelf-dev libncurses-dev lz4 zstd xz-utils bzip2 \
            device-tree-compiler clang lld llvm pahole \
            meson ninja-build cmake cargo curl dpkg-dev \
            libudev-dev libdrm-dev libevent-dev libyaml-dev libjpeg-dev \
            libglib2.0-dev python3-jinja2 python3-ply python3-yaml \
            qt6-base-dev libgl1-mesa-dev
          # Ubuntu's mkbootimg package ships the script without the gki module
          # it imports ("ModuleNotFoundError: No module named 'gki'"), so use
          # the AOSP tree directly: its script finds gki/ next to itself.
          sudo git clone --depth 1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            /usr/local/lib/mkbootimg
          sudo tee /usr/bin/mkbootimg >/dev/null <<'EOF'
          #!/bin/sh
          exec python3 /usr/local/lib/mkbootimg/mkbootimg.py "$@"
          EOF
          sudo chmod 755 /usr/bin/mkbootimg

          # Ubuntu has no avbtool package (and android-tools-mkbootimg was
          # replaced by mkbootimg); the AOSP script is what the image scripts
          # expect at /usr/bin/avbtool.
          # The ?format=TEXT download of avbtool 404s; clone the tree the same
          # way as mkbootimg.  Note that the old version of this step left an
          # empty /usr/bin/avbtool behind, so check for a working one.
          if ! avbtool version >/dev/null 2>&1; then
            sudo rm -f /usr/bin/avbtool
            sudo git clone --depth 1 \
              https://android.googlesource.com/platform/external/avb \
              /usr/local/lib/avb
            if [ -f /usr/local/lib/avb/avbtool.py ]; then
              AVB=/usr/local/lib/avb/avbtool.py
            else
              AVB=$(sudo find /usr/local/lib/avb -maxdepth 1 -name 'avbtool*' ! -name '*test*' | head -1)
            fi
            test -n "$AVB" || { echo "avbtool not found in avb tree" >&2; exit 1; }
            echo "avbtool script: $AVB"
            printf '#!/bin/sh\nexec python3 %s "$@"\n' "$AVB" | sudo tee /usr/bin/avbtool >/dev/null
            sudo chmod 755 /usr/bin/avbtool
          fi
          command -v mkbootimg avbtool dtc clang ld.lld
          avbtool version
          clang --version | head -1
          df -h /

      - name: Set nightly package revision
        run: echo "PKG_REVISION=$(TZ=Asia/Shanghai date +%Y%m%d).$((GITHUB_RUN_ID * 1000 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"

      - name: Checkout linux-zhiyu
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Initialize pinned submodules
        id: kernel
        run: |
          set -euo pipefail
          if ! git submodule update --init --recursive --depth 1; then
            echo "::warning::Shallow submodule checkout failed; retrying with full history"
            git submodule foreach --recursive 'if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow origin; fi'
            git submodule update --init --recursive
          fi
          echo "sha=$(git -C kernel-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore kernel build tree
        id: kernel-cache
        if: inputs.kernel
        uses: actions/cache/restore@v4
        with:
          path: kernel-source
          key: kernel-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel.outputs.sha }}-${{ hashFiles('configs/linux-*-zhiyu.config') }}

      - name: Set up native Rust for the IDL compiler
        if: ${{ inputs.kernel }}
        uses: dtolnay/rust-toolchain@stable

      - name: Build kernel, initramfs and the signed images
        if: ${{ inputs.kernel }}
        run: |
          set -euo pipefail
          JOBS=$(nproc) ./build.sh
          # All LSM variants must be usable from either slot.
          unpack_dir=$(mktemp -d)
          trap 'rm -rf "$unpack_dir"' EXIT
          for image in out/boot*.img; do
            python3 /usr/local/lib/mkbootimg/unpack_bootimg.py \
              --boot_img "$image" --out "$unpack_dir" > "$unpack_dir/header"
            if grep -qF 'androidboot.slot_suffix=' "$unpack_dir/header"; then
              echo "Hardcoded slot in $image" >&2
              exit 1
            fi
          done
          grep -qx 'CONFIG_BOOT_CONFIG=y' configs/linux-7.3-zhiyu.config
          mkdir -p "$unpack_dir/bootconfig"
          python3 /usr/local/lib/mkbootimg/unpack_bootimg.py \
            --boot_img out/boot-apparmor.img --out "$unpack_dir/bootconfig" \
            > "$unpack_dir/bootconfig-header"
          grep -q '^command line args: .* bootconfig ' "$unpack_dir/bootconfig-header" || {
            echo "boot image does not ask ABL to load the bootconfig" >&2
            exit 1
          }
          ls -l out/boot*.img out/vendor_boot.img out/init_boot.img out/vbmeta*.img
          sha256sum out/boot*.img out/vendor_boot.img out/init_boot.img out/vbmeta*.img

      - name: Save kernel build tree
        if: inputs.kernel && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel-source
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: Package kernel modules, headers and firmware
        if: ${{ inputs.kernel }}
        run: |
          set -euo pipefail
          KS=kernel-source
          VER="$(make -s -C "$KS" ARCH=arm64 kernelrelease)"
          echo "kernel release: $VER"

          # ---- modules ----
          make -C "$KS" ARCH=arm64 \
            INSTALL_MOD_PATH="$PWD/stage/linux-zhiyu-modules" modules_install
          # modules_install writes lib/modules; on Arch /lib is a symlink to
          # usr/lib owned by the filesystem package, so packaging lib/... both
          # conflicts with it and would claim the symlink itself.
          mkdir -p "stage/linux-zhiyu-modules/usr"
          if [ -d "stage/linux-zhiyu-modules/lib" ]; then
            mv "stage/linux-zhiyu-modules/lib" "stage/linux-zhiyu-modules/usr/lib"
          fi
          # build/source point into the CI tree; useless (and dangling) in a
          # package.
          rm -f "stage/linux-zhiyu-modules/usr/lib/modules/$VER/build" \
                "stage/linux-zhiyu-modules/usr/lib/modules/$VER/source"
          if command -v depmod >/dev/null; then
            depmod -b "stage/linux-zhiyu-modules/usr" "$VER" || true
          fi
          bash scripts/stage-license-notices.sh stage/linux-zhiyu-modules linux-zhiyu-modules
          PKG_NAME=linux-zhiyu-modules PKG_LICENSE=GPL-2.0-only \
          PKG_VERSION="$VER" \
          PKG_DESC="Linux $VER modules for the zhiyu port" \
          PKG_DEB_DEPENDS="kmod" \
          PKG_ARCH_DEPENDS="kmod" \
          scripts/mkpkgs.sh stage/linux-zhiyu-modules out/pkgs

          # ---- headers ----
          # A prepared build tree, which is what out-of-tree module builds
          # need (UAPI only would be useless for that).
          make -C "$KS" ARCH=arm64 prepare modules_prepare
          # absolute: the copies below run from inside the kernel tree
          H="$PWD/stage/linux-zhiyu-headers/usr/src/linux-headers-$VER"
          install -d "$H/arch/arm64"
          ( cd "$KS" && cp -a include "$H"/include &&
              cp -a arch/arm64/include "$H"/arch/arm64/include &&
              cp -a arch/arm64/Makefile "$H"/arch/arm64/Makefile &&
              cp -a scripts "$H"/scripts &&
              cp -a Module.symvers .config Makefile "$H"/ )
          install -d "stage/linux-zhiyu-headers/usr/lib/modules/$VER"
          ln -sfn "../../../src/linux-headers-$VER" \
            "stage/linux-zhiyu-headers/usr/lib/modules/$VER/build"
          du -sh "$H"
          # provides linux-headers: AUR/out-of-tree module builds depend on
          # that name, and without it pacman would pull Arch's official
          # linux-headers (for the wrong kernel) instead of this tree.
          bash scripts/stage-license-notices.sh stage/linux-zhiyu-headers linux-zhiyu-headers
          PKG_NAME=linux-zhiyu-headers PKG_LICENSE='GPL-2.0-only AND (GPL-2.0-only WITH Linux-syscall-note)' \
          PKG_VERSION="$VER" \
          PKG_DESC="Linux $VER headers for the zhiyu port" \
          PKG_DEB_DEPENDS="gcc-14" \
          PKG_DEB_PROVIDES="linux-headers" \
          PKG_ARCH_DEPENDS="gcc" \
          PKG_ARCH_PROVIDES="linux-headers" \
          scripts/mkpkgs.sh stage/linux-zhiyu-headers out/pkgs

          # ---- firmware ----
          F=stage/linux-zhiyu-firmware/usr/lib/firmware
          install -d "$F"
          cp -a initramfs-src/blobs/firmware/. "$F"/
          install -Dm644 initramfs-src/tplg/sm8750-tplg.bin \
            "$F/qcom/sm8750/sm8750-tplg.bin"
          # The SNS config/registry hexagonrpcd serves to the ADSP belongs with
          # the firmware: the rootfs then gets it from this package instead of
          # copying initramfs-src/blobs/sensors itself.
          Q=stage/linux-zhiyu-firmware/usr/share/qcom
          install -d "$Q"
          cp -a initramfs-src/blobs/sensors "$Q"/
          U=stage/linux-zhiyu-firmware/usr/share/alsa/ucm2
          install -d "$U"
          cp -a scripts/alsa-ucm2/. "$U"/
          R=stage/linux-zhiyu-firmware/usr/lib/udev/rules.d
          V=stage/linux-zhiyu-firmware/etc/udev/rules.d
          install -d "$R"
          install -m644 scripts/90-dma-heap.rules scripts/91-flash-led.rules \
            scripts/90-fastrpc.rules "$R"/
          install -Dm644 scripts/60-persistent-v4l.rules "$V/60-persistent-v4l.rules"
          find "$F" -type f | wc -l
          find "$Q" -type f | wc -l
          find "$U" "$R" -type f | sort
          bash scripts/stage-license-notices.sh stage/linux-zhiyu-firmware linux-zhiyu-firmware
          PKG_NAME=linux-zhiyu-firmware PKG_LICENSE='BSD-3-Clause AND LicenseRef-LICENSE.qcom AND LicenseRef-LICENSE.qcom-2 AND LicenseRef-Zhiyu-Firmware AND LicenseRef-Zhiyu-Unspecified' \
          PKG_VERSION="$VER" \
          PKG_DESC="Firmware blobs, AudioReach topology and SNS registry for the zhiyu port" \
          PKG_DEB_DEPENDS="" \
          PKG_ARCH_DEPENDS="" \
          scripts/mkpkgs.sh stage/linux-zhiyu-firmware out/pkgs

          # The package maintainer hook selects the LSM-matched AVB chain and
          # updates only the slot that actually booted. CONFIG_BOOT_CONFIG plus
          # the kernel's bootconfig command-line switch are required so ABL's
          # androidboot.slot_suffix is available without guessing.
          I=stage/linux-zhiyu-images/usr/lib/linux-zhiyu/images
          install -d "$I"
          install -m644 out/boot-none.img out/boot-selinux.img \
            out/boot-apparmor.img out/vendor_boot.img out/init_boot.img \
            out/vbmeta-none.img out/vbmeta-selinux.img out/vbmeta-apparmor.img "$I"/
          (
            cd "$I"
            sha256sum -- *.img > SHA256SUMS
            stat -c "%s %n" -- *.img > SIZES
            xz -9e -T1 -- *.img
          )
          install -Dm755 scripts/update-boot-images.sh \
            stage/linux-zhiyu-images/usr/libexec/zhiyu/update-boot-images.sh
          bash scripts/stage-license-notices.sh stage/linux-zhiyu-images linux-zhiyu-images
          PKG_NAME=linux-zhiyu-images PKG_LICENSE='GPL-2.0-only AND LGPL-2.1-or-later AND Apache-2.0 AND BSD-3-Clause AND LicenseRef-LICENSE.qcom AND LicenseRef-LICENSE.qcom-2 AND LicenseRef-Zhiyu-Firmware AND LicenseRef-Zhiyu-Unspecified' \
          PKG_VERSION="$VER" \
          PKG_DESC="AVB-signed boot image set and active-slot updater for zhiyu" \
          PKG_DEB_DEPENDS="coreutils, util-linux, grep, sed, mawk | gawk, diffutils, xz-utils, linux-zhiyu-modules (= ${VER}-${PKG_REVISION:-1})" \
          PKG_ARCH_DEPENDS="coreutils util-linux grep sed gawk diffutils xz linux-zhiyu-modules=${VER//-/_}-${PKG_REVISION:-1}" \
          PKG_DEB_POSTINST=scripts/linux-zhiyu-images.postinst \
          PKG_ARCH_INSTALL=scripts/linux-zhiyu-images.install \
          scripts/mkpkgs.sh stage/linux-zhiyu-images out/pkgs
          ls -l out/pkgs

      - name: Build libcamera and package it
        if: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          # The fork keeps one branch per upstream release.  Debian gets both
          # the 0.7 and the 0.8 ABI so packages built against either can be
          # satisfied; Arch only gets 0.7 because its libcamera consumers are
          # still built against that ABI and pacman has no solver to hold a
          # package back.
          #
          # The package is deliberately *not* called "libcamera": on a rolling
          # distribution a newer distro libcamera would replace it silently and
          # the camera would stop working (no qcom-camss).  With its own name
          # plus a conflict, pacman instead refuses that upgrade loudly, and
          # the soname provides (generated by mkpkgs.sh) keep gst-plugin-
          # libcamera / plasma-camera satisfied as long as the distro package
          # is not installed.
          #
          # Note: no comment lines inside the PKG_* backslash chain below,
          # they terminate it.
          for entry in "0.7 zhiyu-0.7.2 deb arch" "0.8 zhiyu-0.8.0 deb"; do
            read -r soname branch formats <<< "$entry"
            src=src/libcamera-$soname
            build=out/libcamera-$soname
            stage=stage/libcamera-$soname
            bash scripts/fetch-libcamera.sh "$branch" "$src"
            meson setup "$build" "$src" --buildtype=release --prefix=/usr --libdir=lib $LC_OPTIONS
            meson compile -C "$build"
            DESTDIR="$PWD/$stage" meson install -C "$build" --no-rebuild
            version=$(meson introspect "$build" --projectinfo |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
            LIBCAMERA_SOURCE="$src" bash scripts/stage-license-notices.sh "$stage" libcamera-zhiyu
            PKG_NAME=libcamera-zhiyu PKG_VERSION="$version" \
            PKG_LICENSE='LGPL-2.1-or-later AND GPL-2.0-or-later AND MIT' \
            PKG_DESC="Camera stack for the zhiyu port (simple pipeline, EGL debayer, CDAF)" \
            PKG_DEB_DEPENDS="libc6, libstdc++6, libudev1, libdrm2, libyaml-0-2, libevent-2.1-7, libjpeg62-turbo, libqt6widgets6" \
            PKG_DEB_PROVIDES="libcamera-tools, libcamera-ipa, libcamera$soname" \
            PKG_DEB_CONFLICTS="libcamera, libcamera-tools, libcamera-ipa, libcamera$soname" \
            PKG_DEB_REPLACES="libcamera, libcamera-tools, libcamera-ipa, libcamera$soname" \
            PKG_ARCH_DEPENDS="gcc-libs glibc systemd-libs libdrm libyaml libevent libjpeg-turbo qt6-base" \
            PKG_ARCH_PROVIDES="libcamera libcamera-tools libcamera-ipa" \
            PKG_ARCH_CONFLICTS="libcamera libcamera-tools libcamera-ipa" \
            PKG_ARCH_REPLACES="libcamera libcamera-tools libcamera-ipa" \
            PKG_FORMATS="$formats" \
            scripts/mkpkgs.sh "$stage" out/pkgs
          done

      - name: Build sensord and package it
        if: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          make -C sensors
          # zhiyu-sensord, not sensord: lm_sensors owns /usr/bin/sensord and
          # its unit, and pacman refuses to overwrite another package's files.
          install -Dm755 sensors/sensord stage/zhiyu-sensord/usr/bin/zhiyu-sensord
          # The unit in the tree points at /usr/local/bin for hand installs;
          # the package owns /usr/bin.
          install -Dm644 sensors/zhiyu-sensord.service \
            stage/zhiyu-sensord/usr/lib/systemd/system/zhiyu-sensord.service
          sed -i 's#^ExecStart=.*#ExecStart=/usr/bin/zhiyu-sensord#' \
            stage/zhiyu-sensord/usr/lib/systemd/system/zhiyu-sensord.service
          bash scripts/stage-license-notices.sh stage/zhiyu-sensord zhiyu-sensord
          PKG_NAME=zhiyu-sensord PKG_LICENSE=GPL-2.0-or-later \
          PKG_VERSION=1.0.0 \
          PKG_DESC="SensorProxy daemon backed by sensh/SNS Client" \
          PKG_DEB_DEPENDS="libc6, libglib2.0-0" \
          PKG_ARCH_DEPENDS="glibc glib2" \
          scripts/mkpkgs.sh stage/zhiyu-sensord out/pkgs
          ls -l out/pkgs

      - name: Build Fedora RPMs
        if: inputs.kernel || inputs.packages
        env:
          BUILD_USERSPACE: ${{ inputs.packages }}
        run: |
          docker run --rm -e PKG_REVISION -e BUILD_USERSPACE \
            -v "$PWD:/work" -w /work quay.io/fedora/fedora:44 \
            scripts/build-fedora-rpms.sh

      - uses: actions/upload-artifact@v4
        if: inputs.kernel || inputs.packages
        with:
          name: zhiyu-fedora-rpms
          path: out/rpms/aarch64/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Archive signed images
        if: inputs.kernel
        env:
          IMAGE_COMPRESSION: ${{ inputs.image_compression }}
        run: |
          set -euo pipefail
          tar -czf out/LICENSES.tar.gz -C stage/linux-zhiyu-images/usr/share/licenses/linux-zhiyu-images .
          cd out
          images=(boot*.img vendor_boot.img init_boot.img vbmeta*.img)
          sha256sum "${images[@]}" LICENSES.tar.gz > SHA256SUMS
          if [ "$IMAGE_COMPRESSION" = xz ]; then
            tar -I 'xz -9e -T1' -cf zhiyu-images.tar.xz "${images[@]}" SHA256SUMS LICENSES.tar.gz
          else
            tar -I 'zstd -T0 -19' -cf zhiyu-images.tar.zst "${images[@]}" SHA256SUMS LICENSES.tar.gz
          fi

      - uses: actions/upload-artifact@v4
        if: inputs.kernel
        with:
          name: zhiyu-images
          path: out/zhiyu-images.tar.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: inputs.kernel || inputs.packages
        with:
          name: zhiyu-package-repositories-input
          path: out/pkgs/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: inputs.publish && inputs.kernel && inputs.packages
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish.yml
