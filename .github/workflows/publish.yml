name: Publish package repositories
run-name: Publish package repositories

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build images and packages run ID
        required: true
        type: string
  # Retry publishing retained build artifacts without rebuilding, via a
  # publish-packages-<run_id> branch or tag (or workflow_dispatch).
  push:
    branches:
      - 'publish-packages-*'
    tags:
      - 'publish-packages-*'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-package-repositories

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve successful build and download earlier artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          set -euo pipefail
          run_id="$BUILD_RUN"
          retry_ref=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == publish-packages-* ]]; then
            retry_ref=true
            run_id="${GITHUB_REF_NAME#publish-packages-}"
            [[ "$run_id" =~ ^[0-9]+$ ]]
          fi
          if [[ -z "$run_id" ]]; then
            # A reusable call can download from its own run after the build
            # job succeeds, while the overall workflow is still running.
            printf "build_sha=%s\nsource_run=%s\n" "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
            echo "same_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          build=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            (.path == ".github/workflows/build.yml" or .path == ".github/workflows/images.yml") and
            .status == "completed" and
            .head_repository.full_name == $repo and
            (.head_branch == "main" or .head_branch == "package-repositories")
          ' <<< "$build" >/dev/null
          # A publishing failure can be retried using the completed build job.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" |
            jq -e 'any(.jobs[]; .name == "build" and .conclusion == "success")' >/dev/null
          build_sha=$(jq -r .head_sha <<< "$build")
          if [[ "$retry_ref" == true ]]; then
            git merge-base --is-ancestor "$build_sha" "$GITHUB_SHA"
          fi
          printf "build_sha=%s\nsource_run=%s\n" "$build_sha" "$run_id" >> "$GITHUB_ENV"
          gh run download "$run_id" --name zhiyu-package-repositories-input --dir out/pkgs
          gh run download "$run_id" --name zhiyu-images --dir out/image-archive

      - uses: actions/download-artifact@v4
        if: steps.source.outputs.same_run == 'true'
        with:
          name: zhiyu-package-repositories-input
          path: out/pkgs

      - uses: actions/download-artifact@v4
        if: steps.source.outputs.same_run == 'true'
        with:
          name: zhiyu-images
          path: out/image-archive

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev pacman-package-manager libarchive-tools zstd

      - name: Download optional Fedora RPMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run/artifacts?name=zhiyu-fedora-rpms" --jq '.total_count')
          if [ "$count" -gt 0 ]; then
            gh run download "$source_run" --name zhiyu-fedora-rpms --dir out/fedora-rpms
          fi

      - name: Verify signed image archive contents
        run: |
          set -euo pipefail
          archives=(out/image-archive/zhiyu-images.tar.*)
          test "${#archives[@]}" -eq 1
          mkdir -p out/release-images
          tar -xf "${archives[0]}" -C out/release-images
          cd out/release-images
          sha256sum -c SHA256SUMS
          for image in boot vendor_boot init_boot vbmeta; do
            test -s "$image.img"
          done

      - name: Generate indexes and publish package sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/mkrepos.sh debian out/pkgs out/repositories
          scripts/mkrepos.sh archlinuxarm out/pkgs out/repositories
          for distro in debian archlinuxarm; do
            dir="out/repositories/$distro"
            case "$distro" in
              debian)
                tag=repo-apt
                package_suffix=.deb
                packages=("$dir"/*.deb)
                indexes=("$dir/Packages" "$dir/Packages.gz" "$dir/Release")
                # Debian carries both libcamera ABIs.
                expected=7
                ;;
              archlinuxarm)
                tag=repo-pacman
                package_suffix=.pkg.tar.zst
                packages=("$dir"/*.pkg.tar.zst)
                indexes=("$dir/zhiyu.files" "$dir/zhiyu.db")
                # Arch only carries the 0.7 ABI.
                expected=6
                ;;
            esac
            test "${#packages[@]}" -eq "$expected"
            # Rolling repository tags are created on the default branch, not on
            # an older build SHA (GITHUB_TOKEN cannot always create such refs).
            notes="Flat package repository for Lenovo TB378FC. Build commit: $build_sha. Use the release download URL as the repository base."
            if gh release view "$tag" >/dev/null 2>&1; then
              # Save the previous asset names before uploading. Prune only after
              # the new indexes are live so they always have matching packages.
              previous=$(gh release view "$tag" --json assets --jq '.assets[].name')
              gh release upload "$tag" "${packages[@]}" --clobber
              gh release upload "$tag" "${indexes[@]}" --clobber
              printf '%s\n' "${packages[@]##*/}" > "$dir/current-packages"
              while IFS= read -r asset; do
                case "$asset" in
                  *"$package_suffix")
                    if ! grep -Fxq -- "$asset" "$dir/current-packages"; then
                      gh release delete-asset "$tag" "$asset" --yes
                    fi
                    ;;
                esac
              done <<< "$previous"
              gh release edit "$tag" --prerelease=false --latest=false --notes "$notes"
            else
              gh release create "$tag" "${packages[@]}" "${indexes[@]}" \
                --latest=false \
                --title "Zhiyu $distro nightly repository" \
                --notes "$notes"
            fi
          done


      - name: Publish signed boot images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=zhiyu-images
          images=(out/release-images/*.img)
          if [ -f out/release-images/LICENSES.tar.gz ]; then
            images+=(out/release-images/LICENSES.tar.gz)
          fi
          if [ -f out/release-images/manifest.json ]; then
            images+=(out/release-images/manifest.json)
          fi
          checksums=out/release-images/SHA256SUMS
          printf 'Signed Lenovo TB378FC boot images from build commit %s.\n' "$build_sha" > image-release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${images[@]}" --clobber
            gh release upload "$tag" "$checksums" --clobber
            gh release edit "$tag" --prerelease=false --latest --notes-file image-release-notes.md
          else
            gh release create "$tag" "${images[@]}" "$checksums" \
              --latest \
              --title "Zhiyu signed boot images" --notes-file image-release-notes.md
          fi


      - name: Publish Fedora RPM repository
        if: hashFiles('out/fedora-rpms/*.rpm') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y createrepo-c
          scripts/publish-fedora-rpms.sh out/fedora-rpms "$build_sha"
